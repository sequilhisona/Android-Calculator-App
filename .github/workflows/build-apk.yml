name: Build Calculator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile and Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p build/compiled_res build/gen build/obj build/apk

          "$BUILD_TOOLS/aapt2" compile --dir app/src/main/res -o build/compiled_res/
          "$BUILD_TOOLS/aapt2" link \
            -o build/apk/app.unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --java build/gen \
            build/compiled_res/*.flat

          javac --release 11 \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            build/gen/com/example/calculator/R.java \
            app/src/main/java/com/example/calculator/MainActivity.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" \
            --output build/apk \
            build/obj/com/example/calculator/*.class

          cd build/apk && zip -u app.unsigned.apk classes.dex && cd ../..

          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out Calculator.apk \
            build/apk/app.unsigned.apk

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: Calculator.apk
